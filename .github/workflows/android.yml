name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk VoiceKeyboard.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceKeyboard-apk
          path: VoiceKeyboard.apk

      - name: Publish APK as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest VoiceKeyboard.apk \
            --title "Voice Keyboard for Android" \
            --notes "Download VoiceKeyboard.apk on your phone and open it to install. Built from commit ${GITHUB_SHA}."
