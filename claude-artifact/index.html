<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Keyboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a sheet of paper sitting on top of a keyboard deck; the mic is the biggest key. */
:root{
  --desk:#e6e9ee;
  --paper:#ffffff;
  --deck:#cfd5de;
  --key:#f8f9fb;
  --key-edge:#aab2c0;
  --ink:#1c2330;
  --ink-soft:#586273;
  --accent:#d8432e;
  --accent-ink:#ffffff;
  --ok:#1f7a4d;
  --warn:#9a5b00;
  --font-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI","Noto Sans","Noto Sans Bengali","Noto Sans Devanagari",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#12161d;--paper:#1b212b;--deck:#262d39;--key:#343d4c;--key-edge:#0c0f14;
    --ink:#eef1f6;--ink-soft:#a3adbd;--accent:#ff6a52;--accent-ink:#1a0d0a;--ok:#5fd39a;--warn:#f0b24a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --desk:#12161d;--paper:#1b212b;--deck:#262d39;--key:#343d4c;--key-edge:#0c0f14;
  --ink:#eef1f6;--ink-soft:#a3adbd;--accent:#ff6a52;--accent-ink:#1a0d0a;--ok:#5fd39a;--warn:#f0b24a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--desk);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 32px;display:flex;flex-direction:column;gap:14px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px}
h1{font-family:var(--font-display);font-weight:700;font-size:1.7rem;margin:0;letter-spacing:-.01em}
header p{margin:0;color:var(--ink-soft);font-size:.95rem}

.paper{background:var(--paper);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 0 var(--key-edge)}
textarea{width:100%;min-height:190px;resize:vertical;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:1.3rem;line-height:1.5;padding:4px}
textarea::placeholder{color:var(--ink-soft);opacity:.8}
textarea:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.live{min-height:1.6em;color:var(--ink-soft);font-style:italic;font-size:1.05rem;padding:0 4px;overflow-wrap:anywhere}
.live b{font-style:normal;font-weight:600;color:var(--accent)}
.status{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;font-size:.9rem;color:var(--ink-soft);border-top:1px solid var(--deck);padding-top:10px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--deck);color:var(--ink);font-weight:500}
.pill i{width:9px;height:9px;border-radius:50%;background:var(--ink-soft)}
.pill.on i{background:var(--accent);animation:pulse 1s infinite}
.pill.work i{background:var(--warn)}
.pill.done i{background:var(--ok)}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pill.on i{animation:none}}
#msg{flex:1 1 200px}
#count{font-variant-numeric:tabular-nums}

.options{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:.95rem}
.options label{display:inline-flex;align-items:center;gap:8px}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid var(--key-edge);background:var(--key);color:var(--ink)}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}

.deck{background:var(--deck);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px}
.row{display:flex;gap:5px}
.k{flex:1 1 0;min-width:0;height:46px;border:0;border-radius:8px;background:var(--key);color:var(--ink);font:500 1.05rem var(--font-body);box-shadow:0 2px 0 var(--key-edge);cursor:pointer;padding:0 2px;touch-action:manipulation}
.k:active{transform:translateY(2px);box-shadow:none}
.k:focus-visible,.act:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.k.wide{flex:1.6 1 0;font-size:.85rem}
.k.space{flex:4 1 0;font-size:.85rem;color:var(--ink-soft)}
.k.held{background:var(--ink);color:var(--paper)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.act{flex:1 1 120px;min-height:52px;border:0;border-radius:10px;background:var(--key);color:var(--ink);font:600 1rem var(--font-body);box-shadow:0 2px 0 var(--key-edge);cursor:pointer;padding:6px 10px}
.act:active{transform:translateY(2px);box-shadow:none}
.act:disabled{opacity:.45;cursor:not-allowed}
#mic{flex:3 1 260px;min-height:68px;background:var(--accent);color:var(--accent-ink);font-family:var(--font-display);font-size:1.3rem;font-weight:700}
#mic.on{background:var(--ink);color:var(--paper)}
#fix{flex:2 1 180px;outline:2px solid var(--accent);outline-offset:-2px}
[hidden]{display:none !important}

.example{font-size:.92rem;color:var(--ink-soft);display:grid;grid-template-columns:auto 1fr;gap:4px 10px;max-width:65ch}
.example dt{font-weight:600;color:var(--ink)}
.example dd{margin:0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Voice Keyboard</h1>
    <p>Speak in any language. It types for you and tidies unclear speech.</p>
  </header>

  <section class="paper">
    <textarea id="text" placeholder="Press Start listening and speak. Your words appear here."></textarea>
    <div class="live" id="live" aria-live="polite"></div>
    <div class="status">
      <span class="pill" id="pill"><i></i><span id="state">Ready</span></span>
      <span id="msg">Loading voice…</span>
      <span id="count">0 words</span>
    </div>
  </section>

  <div class="options">
    <label><input type="checkbox" id="auto" checked> Fix my words automatically when I stop</label>
    <label for="lang">Write in
      <select id="lang">
        <option value="">the language I speak</option>
        <option>English</option><option>Bengali</option><option>Hindi</option><option>Urdu</option>
        <option>Tamil</option><option>Telugu</option><option>Marathi</option><option>Gujarati</option>
        <option>Punjabi</option><option>Spanish</option><option>French</option><option>German</option>
        <option>Portuguese</option><option>Arabic</option><option>Chinese</option><option>Japanese</option>
        <option>Korean</option><option>Russian</option><option>Indonesian</option><option>Swahili</option>
      </select>
    </label>
  </div>

  <section class="deck" aria-label="Keyboard">
    <div class="actions">
      <button class="act" id="mic" type="button" hidden>Start listening</button>
      <button class="act" id="fix" type="button" hidden>Fix my words</button>
      <button class="act" id="undo" type="button" disabled>Undo</button>
      <button class="act" id="copy" type="button">Copy</button>
      <button class="act" id="clear" type="button">Clear</button>
    </div>
    <div id="keys"></div>
  </section>

  <dl class="example">
    <dt>You say</dt><dd>uh so tomorrow I, I can't come to the the meeting because um doctor</dd>
    <dt>It writes</dt><dd>I can't come to the meeting tomorrow because I'm seeing the doctor.</dd>
  </dl>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var ta=$("text"), live=$("live"), pill=$("pill"), stateEl=$("state"), msg=$("msg"), count=$("count");
  var micBtn=$("mic"), fixBtn=$("fix"), undoBtn=$("undo"), copyBtn=$("copy"), clearBtn=$("clear");
  var auto=$("auto"), lang=$("lang");
  var dict=null, sample=null, listening=false, fixing=false, undoStack=[], heardSinceFix=false;

  /* ---------- helpers ---------- */
  function setState(kind,label){ pill.className="pill"+(kind?" "+kind:""); stateEl.textContent=label; }
  function say(t){ msg.textContent=t; }
  function refresh(){
    var w=(ta.value.trim().match(/\S+/g)||[]).length;
    count.textContent=w+(w===1?" word":" words");
    undoBtn.disabled=!undoStack.length;
    try{ localStorage.setItem("vk-draft",ta.value); }catch(e){}
  }
  function pushUndo(){ undoStack.push(ta.value); if(undoStack.length>30) undoStack.shift(); }
  function insert(s){
    var a=ta.selectionStart, b=ta.selectionEnd;
    ta.setRangeText(s,a,b,"end"); refresh();
  }
  function insertPhrase(s){
    s=s.trim(); if(!s) return;
    var before=ta.value.slice(0,ta.selectionStart);
    if(before && !/\s$/.test(before)) s=" "+s;
    insert(s); ta.scrollTop=ta.scrollHeight;
  }
  function backspace(){
    var a=ta.selectionStart, b=ta.selectionEnd;
    if(a===b){ if(a===0) return; a=a-1; }
    ta.setRangeText("",a,b,"end"); refresh();
  }

  /* ---------- on-screen keys ---------- */
  var rows=["1234567890","qwertyuiop","asdfghjkl","zxcvbnm,.?"], shift=false;
  var keysEl=$("keys"); keysEl.style.display="flex"; keysEl.style.flexDirection="column"; keysEl.style.gap="6px";
  function mk(label,cls,fn,aria){
    var b=document.createElement("button"); b.type="button"; b.className="k"+(cls?" "+cls:""); b.textContent=label;
    if(aria) b.setAttribute("aria-label",aria);
    b.addEventListener("pointerdown",function(e){ e.preventDefault(); });
    b.addEventListener("click",fn); return b;
  }
  var letterKeys=[], shiftKey;
  rows.forEach(function(r){
    var row=document.createElement("div"); row.className="row";
    r.split("").forEach(function(ch){
      var b=mk(ch,"",function(){
        pushUndo(); insert(shift?b.textContent:ch);
        if(shift){ shift=false; paintShift(); }
      });
      if(/[a-z]/.test(ch)) letterKeys.push([b,ch]);
      row.appendChild(b);
    });
    keysEl.appendChild(row);
  });
  function paintShift(){
    letterKeys.forEach(function(p){ p[0].textContent=shift?p[1].toUpperCase():p[1]; });
    shiftKey.classList.toggle("held",shift);
  }
  var last=document.createElement("div"); last.className="row";
  shiftKey=mk("Shift","wide",function(){ shift=!shift; paintShift(); });
  last.appendChild(shiftKey);
  last.appendChild(mk("Space","space",function(){ pushUndo(); insert(" "); }));
  last.appendChild(mk("⌫","wide",function(){ pushUndo(); backspace(); },"Backspace"));
  last.appendChild(mk("Enter","wide",function(){ pushUndo(); insert("\n"); }));
  keysEl.appendChild(last);

  /* ---------- fixing unclear speech ---------- */
  function buildPrompt(raw){
    var target=lang.value
      ? "Write the result in "+lang.value+", in its normal script, whatever language was spoken."
      : "Write the result in the same language and script the speaker used. If they mix languages, keep their mix.";
    return "You repair text that came from speech-to-text dictation. The speaker may talk in any language, "+
      "may stutter, repeat words, use fillers, restart sentences, trail off, or be misheard by the recognizer.\n\n"+
      "Rewrite the text so it says clearly what the speaker meant:\n"+
      "- remove fillers, stutters, repeats and false starts\n"+
      "- when they correct themselves, keep only the corrected version\n"+
      "- replace words that were clearly misheard with the word that fits the context\n"+
      "- add punctuation, capitals and paragraph breaks\n"+
      "- keep their meaning, tone and every fact; do not add new ideas, do not answer or comment on the text\n"+
      "- "+target+"\n\n"+
      "Reply with the repaired text only, no quotes and no explanation.\n\n"+
      "Dictated text:\n<<<\n"+raw+"\n>>>";
  }
  function fix(){
    if(fixing||!sample) return;
    var raw=ta.value.trim();
    if(!raw){ say("Nothing to fix yet. Speak or type first."); return; }
    fixing=true; heardSinceFix=false; fixBtn.disabled=true; fixBtn.textContent="Fixing…";
    setState("work","Fixing"); say("Making your words clear…");
    var original=ta.value;
    sample(buildPrompt(raw),{modelTier:"quick",cache:false,onText:function(p){
      if(p.text){ ta.value=p.text; ta.scrollTop=ta.scrollHeight; }
    }}).then(function(r){
      var out=(r.text||"").trim();
      if(!out){ ta.value=original; say("No change came back. Your text is as you left it."); }
      else{ undoStack.push(original); ta.value=out; say("Fixed. Press Undo to get your original words back."); }
      setState("done","Done");
    }).catch(function(e){
      ta.value=original;
      var c=e&&e.code;
      if(c==="not_granted"){ fixBtn.hidden=true; auto.checked=false; auto.disabled=true; say("Fixing is turned off for this page. Your words are typed as heard."); }
      else if(c==="rate_limited"){ say("Too many fixes in a short time. Wait a minute and press Fix my words again."); }
      else{ say("Could not fix the text this time. Press Fix my words to try again."); }
      setState("","Ready");
    }).then(function(){
      fixing=false; fixBtn.disabled=false; fixBtn.textContent="Fix my words";
      ta.selectionStart=ta.selectionEnd=ta.value.length; refresh();
    });
  }
  fixBtn.addEventListener("click",fix);

  /* ---------- listening ---------- */
  function paintMic(){
    micBtn.classList.toggle("on",listening);
    micBtn.textContent=listening?"Stop listening":"Start listening";
  }
  micBtn.addEventListener("click",function(){
    if(!dict) return;
    if(listening){ dict.stop().catch(function(){}); return; }
    dict.start().catch(function(e){
      var c=e&&e.code||e&&e.message||"";
      if(String(c).indexOf("not_granted")>=0){ micBtn.hidden=true; say("Microphone access was refused. You can still type with the keys below."); }
      else{ say("Listening did not start. Press Start listening again."); }
    });
    ta.selectionStart=ta.selectionEnd=ta.value.length;
  });
  function wireDictation(d){
    dict=d; micBtn.hidden=false; say("Press Start listening and speak naturally.");
    d.onPartial(function(p){ live.innerHTML=""; var b=document.createElement("b"); b.textContent="Hearing: "; live.appendChild(b); live.appendChild(document.createTextNode(p.text||"")); });
    d.onFinal(function(p){
      live.textContent="";
      if(p.text&&p.text.trim()){ pushUndo(); insertPhrase(p.text); heardSinceFix=true; }
    });
    d.onState(function(s){
      var was=listening; listening=s.state==="listening"; paintMic();
      if(listening){ setState("on","Listening"); say("Speak now. Take your time."); }
      else{
        live.textContent="";
        if(was){
          setState("","Ready");
          if(s.reason==="hidden") say("Listening paused because the page was hidden.");
          else say("Stopped.");
          if(auto.checked&&sample&&heardSinceFix&&ta.value.trim()) fix();
        }
      }
    });
  }

  /* ---------- other actions ---------- */
  undoBtn.addEventListener("click",function(){
    if(!undoStack.length||fixing) return;
    ta.value=undoStack.pop(); ta.selectionStart=ta.selectionEnd=ta.value.length; refresh(); say("Undone.");
  });
  clearBtn.addEventListener("click",function(){
    if(!ta.value||fixing) return; pushUndo(); ta.value=""; refresh(); say("Cleared. Press Undo to bring it back.");
  });
  copyBtn.addEventListener("click",function(){
    if(!ta.value){ say("Nothing to copy yet."); return; }
    try{
      navigator.clipboard.writeText(ta.value).then(function(){ say("Copied. Paste it anywhere."); },
        function(){ ta.select(); say("Copy was blocked. The text is selected, press Ctrl+C."); });
    }catch(e){ ta.select(); say("Copy was blocked. The text is selected, press Ctrl+C."); }
  });
  ta.addEventListener("input",refresh);

  try{ var d0=localStorage.getItem("vk-draft"); if(d0) ta.value=d0; }catch(e){}
  refresh();

  /* ---------- capabilities ---------- */
  function boot(){
    if(!window.claude||!window.claude.use){
      say("Voice is not available in this view. You can type with the keys below."); return;
    }
    window.claude.use("dictation").then(function(d){
      if(d) wireDictation(d);
      else say("Voice needs Chrome or the Claude desktop app. You can still type here and use Fix my words.");
    },function(){ say("Voice is not available in this view. You can type with the keys below."); });
    window.claude.use("sample").then(function(s){
      if(s){ sample=s; fixBtn.hidden=false; }
      else{ auto.checked=false; auto.disabled=true; }
    },function(){ auto.checked=false; auto.disabled=true; });
  }
  boot();
})();
</script>
</body>
</html>
